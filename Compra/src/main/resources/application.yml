spring:
  application:
    name: Compra
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/compra_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak valida el JWT usando claves públicas (JWK Set)
          issuer-uri: http://localhost:8888/realms/app-realm
          jwk-set-uri: http://keycloak:8080/realms/app-realm/protocol/openid-connect/certs

server:
  port: 8083  # Se escribió en 8083 para evitar conflictos con otros puertos

producto:
  service:
    url: http://producto-service:8081

rest:
  client:
    connect-timeout: 5000
    read-timeuot: 10000

weather:
  api:
    url: https://api.open-meteo.com
    timeout: 5000