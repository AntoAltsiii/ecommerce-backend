server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ─── SPA fallback ────────────────────────────────────────────────────────
    # React Router maneja las rutas en el cliente. Si el usuario navega
    # directamente a /carrito o /admin, nginx no tiene ese archivo físico.
    # Con try_files, nginx primero busca el archivo real ($uri), luego un
    # directorio ($uri/), y si no existe ninguno sirve index.html para que
    # React Router tome el control.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Caché para assets estáticos ────────────────────────────────────────
    # Vite genera nombres con hash en los JS/CSS (ej: index-a1b2c3d4.js),
    # así que podemos cachearlos mucho tiempo. El browser solo los re-descarga
    # cuando el hash cambia (nuevo build).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── No cachear index.html ────────────────────────────────────────────────
    # index.html siempre debe ser fresco para que el browser tome el último
    # build con los nuevos hashes de assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ─── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
