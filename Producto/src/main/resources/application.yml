spring:
  application:
    name: Producto
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/producto_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak valida el JWT usando claves públicas (JWK Set)
          issuer-uri: http://localhost:8888/realms/app-realm
          jwk-set-uri: http://keycloak:8080/realms/app-realm/protocol/openid-connect/certs

server:
  port: 8081  # Se escribió en 8081 para evitar conflictos con otros puertos
