spring:
  application:
    name: Gateway
  cloud:
    gateway:
      routes:
        - id: compra-service
          uri: http://compra-service:8083
          predicates:
            - Path=/api/compra/**,/api/compras/**,/api/item/**,/api/items/**,/api/usuario/**,/api/usuarios/**,/api/envio/**,/api/sucursal/**,/api/pago/**,/api/stock/**,/api/clima/**
        
        - id: producto-service
          uri: http://producto-service:8081
          predicates:
            - Path=/api/prendas/**,/api/categorias/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  security:
    oauth2:
      # Cliente OAuth2 (para login automático)
      client:
        registration:
          keycloak:
            client-id: gateway-client
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
            client-name: Keycloak
            client-authentication-method: none  # PKCE - cliente público
        provider:
          keycloak:
            # URL para el navegador (login del usuario)
            authorization-uri: http://localhost:8888/realms/app-realm/protocol/openid-connect/auth
            # URLs internas (gateway → keycloak dentro de Docker)
            token-uri: http://keycloak:8080/realms/app-realm/protocol/openid-connect/token
            user-info-uri: http://keycloak:8080/realms/app-realm/protocol/openid-connect/userinfo
            jwk-set-uri: http://keycloak:8080/realms/app-realm/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      
      # Resource Server (validar JWT en requests)
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/app-realm
          jwk-set-uri: http://keycloak:8080/realms/app-realm/protocol/openid-connect/certs

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG